name: Finalize ranking scroll glass fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point button at local Haze source
        shell: python
        run: |
          from pathlib import Path
          path = Path("app/src/main/java/com/example/borderly/RankingScreen (13).kt")
          text = path.read_text(encoding="utf-8")
          old = """                    .hazeEffect(
                        state = hazeState,
                        style = mapControlHazeStyle
                    ) {
"""
          new = """                    .hazeEffect(
                        state = scrollToTopHazeState,
                        style = mapControlHazeStyle
                    ) {
"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "app/src/main/java/com/example/borderly/RankingScreen (13).kt"
          git commit -m "Use local Haze source for ranking glass button"
          git push
