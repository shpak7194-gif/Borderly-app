name: Apply ranking scroll glass fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply Borderly scroll-to-top glass fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/java/com/example/borderly/RankingScreen (13).kt")
          text = path.read_text(encoding="utf-8")

          import_anchor = "import dev.chrisbanes.haze.hazeEffect\n"
          if "import dev.chrisbanes.haze.hazeSource\n" not in text:
              assert text.count(import_anchor) == 1
              text = text.replace(
                  import_anchor,
                  import_anchor
                  + "import dev.chrisbanes.haze.hazeSource\n"
                  + "import dev.chrisbanes.haze.rememberHazeState\n",
                  1,
              )

          state_anchor = "    val rankingListState = rememberLazyListState()\n"
          if "val scrollToTopHazeState = rememberHazeState()" not in text:
              assert text.count(state_anchor) == 1
              text = text.replace(
                  state_anchor,
                  state_anchor
                  + "    // Local backdrop source for the floating Borderly glass button.\n"
                  + "    val scrollToTopHazeState = rememberHazeState()\n",
                  1,
              )

          list_old = (
              "        LazyColumn(\n"
              "            state = rankingListState,\n"
              "            modifier = Modifier.fillMaxSize(),\n"
          )
          list_new = (
              "        LazyColumn(\n"
              "            state = rankingListState,\n"
              "            modifier = Modifier\n"
              "                .fillMaxSize()\n"
              "                .hazeSource(state = scrollToTopHazeState),\n"
          )
          if ".hazeSource(state = scrollToTopHazeState)" not in text:
              assert text.count(list_old) == 1
              text = text.replace(list_old, list_new, 1)

          effect_old = (
              "                    .hazeEffect(\n"
              "                        state = hazeState,\n"
              "                        style = mapControlHazeStyle\n"
              "                    ) {\n"
          )
          effect_new = (
              "                    .hazeEffect(\n"
              "                        state = scrollToTopHazeState,\n"
              "                        style = mapControlHazeStyle\n"
              "                    ) {\n"
          )
          if "state = scrollToTopHazeState" not in text:
              assert text.count(effect_old) == 1
              text = text.replace(effect_old, effect_new, 1)

          path.write_text(text, encoding="utf-8", newline="\n")

      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "app/src/main/java/com/example/borderly/RankingScreen (13).kt"
          git commit -m "Fix ranking scroll-to-top glass"
          git push
