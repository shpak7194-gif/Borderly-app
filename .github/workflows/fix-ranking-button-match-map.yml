name: Fix ranking button to match map controls

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make ranking scroll button identical to map controls
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/java/com/example/borderly/RankingScreen (13).kt")
          text = path.read_text(encoding="utf-8")

          style_start_marker = "    // Use the same Haze parameters as the bottom navigation itself."
          style_end_marker = "    val glassRimColor = borderlyControlRimColor()"
          style_start = text.index(style_start_marker)
          style_end = text.index(style_end_marker, style_start)

          new_style = """    // Exact same glass recipe as the 48.dp map +/- controls.
          val mapControlHazeStyle = HazeStyle(
              backgroundColor = MaterialTheme.colorScheme.surface,
              tint = HazeTint(roundControlColor),
              blurRadius = 3.dp,
              noiseFactor = 0f,
              fallbackTint = HazeTint(roundControlColor)
          )
          """.replace("          ", "")

          text = text[:style_start] + new_style + text[style_end:]

          button_scope = text.index("        if (showScrollToTop) {")
          background_start = text.index("                    .background(", button_scope)
          haze_start = text.index("                    .hazeEffect(", background_start)
          text = text[:background_start] + text[haze_start:]

          path.write_text(text, encoding="utf-8", newline="\n")

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/fix-ranking-button-match-map.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "app/src/main/java/com/example/borderly/RankingScreen (13).kt" .github/workflows/fix-ranking-button-match-map.yml
          git commit -m "Match ranking scroll button to map controls"
          git push
